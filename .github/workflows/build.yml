name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Write config.json from secrets
        run: |
          cat > config.json <<EOF
          {
            "server_host": "${{ secrets.TGPROXY_SERVER_HOST }}",
            "http_token": "${{ secrets.TGPROXY_HTTP_TOKEN }}",
            "api_id": ${{ secrets.TGPROXY_API_ID }},
            "api_hash": "${{ secrets.TGPROXY_API_HASH }}"
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake build-essential \
            libltdl-dev ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Cache buildozer global + .buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgproxycheck-apk
          path: bin/*.apk
